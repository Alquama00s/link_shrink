<app-nav />
<div class="action-tab">
  <div class="button" (click)="openForm()">Add url</div>
</div>
<div class="grid">
  <ag-grid-angular
    class="ag-theme-quartz-dark"
    [rowData]="rowData"
    [columnDefs]="colDefs"
  />
</div>

<div *ngIf="showForm" class="popup-form">
  <form [formGroup]="urlForm">
    <mat-form-field>
      <mat-label>Url</mat-label>
      <input matInput
      aria-label="long url"
      formControlName="longUrl" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>short url</mat-label>
      <input matInput
      aria-label="short url"
      formControlName="shortUrl" />
    </mat-form-field>
    @for (sug of suggestions;track sug) {
        <div class="suggestion-box" (click)="onSuggestionClick(sug)">{{sug}}</div>
    }
    <div class="button-box">
      <button mat-flat-button color="primary" (click)="addUrl()">Submit</button>
      <button
        mat-raised-button
        color="accent"
        type="button"
        (click)="closeForm()"
      >
        Close
      </button>
    </div>
  </form>

</div>
