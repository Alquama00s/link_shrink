<div class="background">
  <div class="popup-form">
    <form>
      <mat-form-field>
        <mat-label>email</mat-label>
        <input aria-label="email" matInput [(ngModel)]="email" name="email" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>password</mat-label>
        <input aria-label="password"
        type="password"
        matInput [(ngModel)]="password" name="password" />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="login()">Submit</button>
      <button mat-flat-button color="primary" (click)="signUp()">
        Sign Up
      </button>
    </form>
  </div>
</div>
