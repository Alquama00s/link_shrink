services:
  redis: 
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - app-network
  
  authn-db:
    build: 
      context: .
      dockerfile: Docker/database/authn/Dockerfile
    networks:
      - app-network
    environment:
      - POSTGRES_PASSWORD=authUser_123
    expose:
      - 5432
  
  redirector-db:
    build: 
      context: .
      dockerfile: Docker/database/redirector/Dockerfile
    networks:
      - app-network
    environment:
      - POSTGRES_PASSWORD=redirectUser_123
    expose:
      - 5432
  
  authn:
    build: 
      context: authn
    depends_on:
      - authn-db
    networks:
      - app-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://authn-db:5432/linkshrink
      - SPRING_DATASOURCE_USERNAME=backend
      - SPRING_DATASOURCE_PASSWORD=authUser_123
      - FRONTEND_URI=http://localhost:4200

    ports:
      - 8071:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      retries: 5
  
  shortner:
    build: 
      context: shortner
    depends_on:
      - redirector-db
      - authn
    networks:
      - app-network
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://redirector-db:5432/linkshrink
      - SPRING_DATASOURCE_USERNAME=backend
      - SPRING_DATASOURCE_PASSWORD=redirectUser_123
      - URLS_SHORTNER=http://shortner:8080
      - URLS_AUTHN=http://authn:8080
      - FRONTEND_URI=http://localhost:4200

    ports:
      - 8072:8080

  redirector:
    build: 
      context: redirector
    depends_on: 
      - shortner
      - authn
    networks:
      - app-network
    environment:
      - URLS_SHORTNER=http://shortner:8080
      - URLS_AUTHN=http://authn:8080
      - FRONTEND_URI=http://localhost:4200
    ports:
      - 8073:8081
  
  frontend:
    build: 
      context: .
      dockerfile: Docker/frontend/Dockerfile
    networks:
      - app-network
    ports:
      - 4200:80
    
volumes:
  redis_data:

networks:
  app-network:

  
